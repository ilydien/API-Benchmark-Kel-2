services:
  fastapi:
    build: ./fastapi
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./files:/app/files
    profiles:
      - nolb

  fastapi-1:
    build: ./fastapi
    env_file:
      - .env
    volumes:
      - ./files:/app/files
    profiles:
      - lb

  fastapi-2:
    build: ./fastapi
    env_file:
      - .env
    volumes:
      - ./files:/app/files
    profiles:
      - lb

  fastapi-3:
    build: ./fastapi
    env_file:
      - .env
    volumes:
      - ./files:/app/files
    profiles:
      - lb

  nginx:
    image: docker.io/nginx:1.31.4-alpine3.24
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - lb
    depends_on:
      - fastapi-1
      - fastapi-2
      - fastapi-3

  locust:
    image: docker.io/locustio/locust:2.46.4
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/locustfile.py
    working_dir: /
    environment:
      LOCUST_HOST: http://fastapi:8000
    depends_on:
      - fastapi
    profiles:
      - nolb
    entrypoint: locust -f /locustfile.py --processes 4

  locust-lb:
    image: docker.io/locustio/locust:2.46.4
    ports:
      - "8090:8089"
    volumes:
      - ./locustfile.py:/locustfile.py
    working_dir: /
    environment:
      LOCUST_HOST: http://nginx:80
    depends_on:
      - fastapi-1
      - fastapi-2
      - fastapi-3
    profiles:
      - lb
    entrypoint: locust -f /locustfile.py --processes 4
